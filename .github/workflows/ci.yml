name: CI

on:
  push:
    branches:
      - 'master'

jobs:
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/client/package-lock.json

      - name: Test
        run: cd src/client && npm ci && npm run check && npm test

      - name: Restore
        run: dotnet restore ./src/SharedMarkdown/SharedMarkdown.csproj -r linux-x64 -p:SelfContained=true

      - name: Build
        run: dotnet publish ./src/SharedMarkdown/SharedMarkdown.csproj --configuration Release --no-restore --output ./ReleaseBuild -r linux-x64 --self-contained

      - name: CopyToServer
        uses: appleboy/scp-action@v1
        with:
          host: sharedmarkdown.com
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          username: studue
          source: "./ReleaseBuild"
          target: "/opt/sharedmarkdown/releases/current"
          rm: true

      - name: Restart
        uses: appleboy/ssh-action@v1
        with:
          host: sharedmarkdown.com
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          username: studue
          script: sudo systemctl restart sharedmarkdown
