<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SharedMarkdown</title>
<meta name="description" content="Markdown you can share with a link. No accounts, write together in real time.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fed'/%3E%3Cpath d='M9 22l8-12m-1 12l8-12' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script>try{var t=JSON.parse(localStorage.getItem('theme'));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>/*CSS*/</style>
<script type="module" src="/*JS*/"></script>
</head>
<body>
<aside id="side">
  <div class="brand"><svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M9 22l8-12m-1 12l8-12" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>SharedMarkdown</div>
  <button id="new">+ New document</button>
  <div class="label">Documents</div>
  <nav id="list"></nav>
  <a id="source" href="https://github.com/FlurinBruehwiler/sharedmarkdown" target="_blank" rel="noopener" aria-label="Source code on GitHub" title="Source code on GitHub"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
</aside>
<div id="scrim"></div>
<main>
  <header>
    <button id="menu" class="icon" aria-label="Documents"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <span id="status">Offline, reconnecting…</span>
    <span id="ro" title="Opened with a read-only link: you can see changes as they happen, but not edit">View only</span>
    <span class="sp"></span>
    <span id="people"></span>
    <div id="share">
      <button id="copy">Copy link</button>
      <button id="copy-more" aria-label="More ways to share" aria-haspopup="menu" aria-expanded="false" aria-controls="copy-menu"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div id="copy-menu" role="menu" aria-label="Share" hidden>
        <button id="copy-ro" role="menuitem" tabindex="-1">Copy read-only link</button>
      </div>
    </div>
    <button id="theme" class="icon" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/></svg></button>
  </header>
  <div id="editor"></div>
  <div id="notice" role="status" hidden></div>
</main>
</body>
</html>
